<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AWS hybrid cloud security lab evidence overview</title>
  <desc id="desc">A diagram showing a segmented AWS lab, CloudTrail collection in S3, Splunk analysis, and four evidence metrics.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#112a45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <circle cx="1080" cy="76" r="180" fill="#2dd4bf" opacity=".07"/>
  <circle cx="104" cy="590" r="220" fill="#60a5fa" opacity=".06"/>

  <text x="64" y="72" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="700">AWS Hybrid Cloud Security Lab</text>
  <text x="64" y="108" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18">Segmented infrastructure → audit collection → SIEM analysis</text>

  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <rect x="64" y="154" width="300" height="230" rx="20" fill="#10243b" stroke="#315170"/>
    <text x="92" y="193" fill="#60a5fa" font-size="15" font-weight="700" letter-spacing="1.2">AWS NETWORK</text>
    <rect x="92" y="220" width="244" height="62" rx="12" fill="#173654"/>
    <text x="112" y="247" fill="#f8fafc" font-size="18" font-weight="650">Public subnet</text>
    <text x="112" y="268" fill="#9fb5cc" font-size="14">Web workload · restricted SSH</text>
    <rect x="92" y="298" width="244" height="62" rx="12" fill="#173654"/>
    <text x="112" y="325" fill="#f8fafc" font-size="18" font-weight="650">Private subnet</text>
    <text x="112" y="346" fill="#9fb5cc" font-size="14">No direct public route</text>

    <path d="M382 269H447" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
    <path d="M438 260L450 269L438 278" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="466" y="184" width="268" height="170" rx="20" fill="#10243b" stroke="#315170"/>
    <text x="494" y="223" fill="#fbbf24" font-size="15" font-weight="700" letter-spacing="1.2">AUDIT PIPELINE</text>
    <text x="494" y="267" fill="#f8fafc" font-size="22" font-weight="650">CloudTrail → S3</text>
    <text x="494" y="298" fill="#9fb5cc" font-size="15">Management events retained</text>
    <text x="494" y="322" fill="#9fb5cc" font-size="15">and retrieved with AWS CLI</text>

    <path d="M752 269H817" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
    <path d="M808 260L820 269L808 278" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="836" y="184" width="300" height="170" rx="20" fill="#10243b" stroke="#315170"/>
    <text x="864" y="223" fill="#2dd4bf" font-size="15" font-weight="700" letter-spacing="1.2">SPLUNK</text>
    <text x="864" y="267" fill="#f8fafc" font-size="22" font-weight="650">Parse · search · alert</text>
    <text x="864" y="298" fill="#9fb5cc" font-size="15">Nested-record expansion</text>
    <text x="864" y="322" fill="#9fb5cc" font-size="15">and control-plane detections</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="64" y="436" fill="#f8fafc" font-size="20" font-weight="700">Time-bounded evidence</text>
    <g transform="translate(64 462)">
      <rect width="250" height="112" rx="16" fill="#0d2035" stroke="#274967"/>
      <text x="24" y="48" fill="#60a5fa" font-size="31" font-weight="750">2</text>
      <text x="24" y="79" fill="#b8c8d8" font-size="15">network segments</text>
    </g>
    <g transform="translate(338 462)">
      <rect width="250" height="112" rx="16" fill="#0d2035" stroke="#274967"/>
      <text x="24" y="48" fill="#fbbf24" font-size="31" font-weight="750">40</text>
      <text x="24" y="79" fill="#b8c8d8" font-size="15">CloudTrail events reviewed</text>
    </g>
    <g transform="translate(612 462)">
      <rect width="250" height="112" rx="16" fill="#0d2035" stroke="#274967"/>
      <text x="24" y="48" fill="#2dd4bf" font-size="31" font-weight="750">3</text>
      <text x="24" y="79" fill="#b8c8d8" font-size="15">scheduled alert concepts</text>
    </g>
    <g transform="translate(886 462)">
      <rect width="250" height="112" rx="16" fill="#0d2035" stroke="#274967"/>
      <text x="24" y="48" fill="#c4b5fd" font-size="24" font-weight="750">Complete</text>
      <text x="24" y="79" fill="#b8c8d8" font-size="15">lab decommissioned</text>
    </g>
  </g>

  <text x="64" y="607" fill="#6f8aa4" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">Sanitized portfolio view · raw account, credential, and network identifiers withheld</text>
</svg>
